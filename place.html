<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Angelica Sulub | Country Page</title>

    <meta name="description" content="information about Yucatan, Mexico, with some pictures about pyramid and part of merida city">
    <meta name="author" content="Angelica Sulub">

    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Yucatan</h1>
    </header>

    <main>
        <picture class="hero">
            <source srcset="images/merida.webp" media="(min-width: 640px)">

            <img src="images/chichenitza-small.webp" alt="Chichen Itza Mayan pyramid in Yucatan" width="500" height="500">
        </picture>

        <section class="data">
            <h2>Data</h2>

            <table>
                <tbody>
                    <tr>
                        <th>Area:</th>
                        <td>39,524 km²</td>
                    </tr>

                    <tr>
                        <th>Population:</th>
                        <td>2,320,898</td>
                    </tr>

                    <tr>
                        <th>Capital:</th>
                        <td>Mérida</td>
                    </tr>

                    <tr>
                        <th>Country:</th>
                        <td>Mexico</td>
                    </tr>

                    <tr>
                        <th>Language:</th>
                        <td>Spanish and Mayan</td>
                    </tr>

                    <tr>
                        <th>Currency:</th>
                        <td>Mexican Peso</td>
                    </tr>

                    <tr>
                        <th>Time Zone:</th>
                        <td>UTC-6</td>
                    </tr>

                    <tr>
                        <th>Calling Code:</th>
                        <td>+52</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <img src="images/sunny.svg" alt="sunny weather">

            <table>
                <tbody>
                    <tr>
                        <th>Temperature:</th>
                        <td>30 °C</td>
                    </tr>

                    <tr>
                        <th>Conditions:</th>
                        <td>Sunny</td>
                    </tr>

                    <tr>
                        <th>Wind:</th>
                        <td>10 km/h</td>
                    </tr>

                    <tr>
                        <th>Wind Chill:</th>
                        <td id="windchill">N/A</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    

    <footer>
        <p>
            &copy;
            <span id="currentYear"></span>
            🌮 Angelica Sulub 🌮 Mexico 
        </p>

        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
